<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふわふわマルチツール</title>

<!-- ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>

<style>
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN", sans-serif;
  background:#fffaf0;
}

/* ===== タブ ===== */
.tabs{
  display:flex;
  background:#fffaf0;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.tab{
  flex:1;
  padding:15px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#fdf3db;
}

/* ===== 画面 ===== */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* ===== TXT変換 ===== */
.container{
  background:#ffffff;
  max-width:500px;
  margin:30px auto;
  padding:30px;
  border-radius:30px;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  text-align:center;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-8px);}
  100%{transform:translateY(0px);}
}

.file-label{
  display:block;
  padding:20px;
  background:#fffaf0;
  border:2px dashed #e6d8b5;
  border-radius:25px;
  cursor:pointer;
  margin-bottom:20px;
}

input[type="file"]{
  display:none;
}

button{
  background:#fffaf0;
  border:none;
  padding:15px 20px;
  margin:10px;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* ===== HTMLプレビュー ===== */
.editor-container{
  height:80vh;
  display:flex;
  flex-direction:column;
}

.editor-body{
  flex:1;
  display:flex;
}

textarea{
  width:50%;
  border:none;
  padding:20px;
  font-size:16px;
  outline:none;
  resize:none;
  background:#fffaf0;
}

iframe{
  width:50%;
  border:none;
}

.editor-header{
  background:#fffaf0;
  padding:10px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.fullscreen iframe{
  width:100%;
}

@media(max-width:768px){
  .editor-body{
    flex-direction:column;
  }
  textarea,iframe{
    width:100%;
    height:50%;
  }
}
</style>
</head>

<body>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('txt', this)">TXT変換</div>
  <div class="tab" onclick="switchTab('html', this)">HTMLプレビュー</div>
</div>

<!-- ===== TXT変換画面 ===== -->
<div id="txt" class="screen active">
  <div class="container">
    <h2>🌸 TXT → PDF / PPTX 🌸</h2>

    <label class="file-label">
      📄 TXTファイルを選択
      <input type="file" id="fileInput" accept=".txt">
    </label>

    <button onclick="convertToPDF()">PDFに変換</button>
    <button onclick="convertToPPT()">PPTXに変換</button>

    <div style="font-size:12px;color:#c5b79e;">ふわふわ変換ツール ✨</div>
  </div>
</div>

<!-- ===== HTMLプレビュー画面 ===== -->
<div id="html" class="screen">
  <div class="editor-container">

    <div class="editor-header">
      HTMLライブプレビュー 🚀
      <button onclick="downloadHTML()">ダウンロード</button>
      <button onclick="activatePreview()">起動成功</button>
    </div>

    <div class="editor-body" id="editorContainer">
      <textarea id="code" placeholder="ここにコードを打つ"></textarea>
      <iframe id="preview"></iframe>
    </div>

  </div>
</div>

<script>
/* ===== タブ切替（修正版） ===== */
function switchTab(id, el){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  el.classList.add("active");
}

/* ===== TXT変換 ===== */
let fileContent="";

document.getElementById("fileInput").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=function(event){
    fileContent=event.target.result;
    alert("読み込み完了 ✨");
  };
  reader.readAsText(file,"UTF-8");
});

function convertToPDF(){
  if(!fileContent){alert("TXTファイルを選択してね 🌸");return;}
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();
  const lines=doc.splitTextToSize(fileContent,180);
  doc.text(lines,10,10);
  doc.save("converted.pdf");
}

function convertToPPT(){
  if(!fileContent){alert("TXTファイルを選択してね 🌸");return;}
  let pptx=new PptxGenJS();
  let slide=pptx.addSlide();
  slide.addText(fileContent,{
    x:1,y:1,w:8,h:5,fontSize:18,color:"333333"
  });
  pptx.writeFile("converted.pptx");
}

/* ===== HTMLプレビュー ===== */
const textarea=document.getElementById("code");
const preview=document.getElementById("preview");
const container=document.getElementById("editorContainer");

function updatePreview(){
  preview.srcdoc=textarea.value||"<h2>プレビュー待機中...</h2>";
}
textarea.addEventListener("input",updatePreview);
updatePreview();

function downloadHTML(){
  const blob=new Blob([textarea.value],{type:"text/html"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="index.html";
  link.click();
}

function activatePreview(){
  container.classList.add("fullscreen");
}
</script>

</body>
</html>
