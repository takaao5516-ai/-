 <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Audio Extractor</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    text-align:center;
    padding:40px;
}
.container{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    max-width:600px;
    margin:auto;
}
input{
    margin:20px 0;
}
button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{ background:#e68900; }
audio{ width:100%; margin-top:20px; }
#status{ margin-top:20px; }
</style>
</head>
<body>

<div class="container">
<h1>🎵 Video → MP3 Extractor</h1>

<p>動画ファイルを選択するとMP3に変換します。</p>

<input type="file" id="fileInput" accept="video/*"><br>

<button onclick="convert()">Convert to MP3</button>

<p id="status"></p>

<audio id="audio" controls></audio><br>

<a id="download"></a>
</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: false });

async function convert(){
    const file = document.getElementById("fileInput").files[0];
    const status = document.getElementById("status");

    if(!file){
        alert("動画ファイルを選択してください");
        return;
    }

    status.innerText = "🔄 変換中...";

    if(!ffmpeg.isLoaded()){
        await ffmpeg.load();
    }

    ffmpeg.FS("writeFile","input",await fetchFile(file));
    await ffmpeg.run("-i","input","-vn","-acodec","libmp3lame","output.mp3");

    const data = ffmpeg.FS("readFile","output.mp3");
    const blob = new Blob([data.buffer],{type:"audio/mp3"});
    const url = URL.createObjectURL(blob);

    document.getElementById("audio").src = url;

    const dl = document.getElementById("download");
    dl.href = url;
    dl.download = "audio.mp3";
    dl.innerText = "⬇ Download MP3";
    dl.style.color = "white";

    status.innerText = "✅ 変換完了";
}
</script>

</body>
</html>
